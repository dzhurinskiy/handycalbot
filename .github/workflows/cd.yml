name: CD

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TELEGRAM_BOT_TOKEN,DB_PASSWORD,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,ENCRYPTION_KEY,GOOGLE_REDIRECT_URI,WEBHOOK_URL,ADMIN_CHAT_ID,ZOOM_CLIENT_ID,ZOOM_CLIENT_SECRET
          script: |
            cd /opt/handycal

            # Pull latest code
            git fetch origin
            git reset --hard origin/master

            # Generate .env from secrets
            cat > .env << ENVEOF
            # Auto-generated by GitHub Actions
            TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
            DATABASE_URL=postgresql+asyncpg://calendarbot:${DB_PASSWORD}@db:5432/calendarbot
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
            ENCRYPTION_KEY=${ENCRYPTION_KEY}
            DB_PASSWORD=${DB_PASSWORD}
            APP_ENV=production
            APP_HOST=0.0.0.0
            APP_PORT=8000
            WEBHOOK_URL=${WEBHOOK_URL}
            DEFAULT_MEETING_DURATION=60
            LOG_LEVEL=INFO
            ADMIN_CHAT_ID=${ADMIN_CHAT_ID}
            ZOOM_CLIENT_ID=${ZOOM_CLIENT_ID}
            ZOOM_CLIENT_SECRET=${ZOOM_CLIENT_SECRET}
            ZOOM_REDIRECT_URI=https://handycal.dzhurinskiy.com/auth/zoom/callback
            ENVEOF

            echo ">>> .env generated"

            # Build and restart containers (--wait waits for health checks)
            docker compose build --no-cache app
            docker compose up -d --wait --wait-timeout 120

            echo ">>> All containers healthy"

            # Run database migrations
            docker compose exec -T app alembic upgrade head || echo "Migration skipped (may already be current)"

            echo ">>> Migrations complete"

            # Test actual bot functionality by checking logs for startup errors
            sleep 5
            if docker logs calendarbot 2>&1 | tail -20 | grep -q "ERROR\|Exception\|Traceback"; then
              echo "ERROR: Bot has errors in logs!"
              docker logs calendarbot 2>&1 | tail -50
              exit 1
            fi

            echo ">>> Bot logs look healthy"

            # Cleanup old images
            docker image prune -f

            echo "Deployment successful!"

      - name: Notify on Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            MSG="✅ HandyCalBot deployed successfully!"
          else
            MSG="❌ HandyCalBot deployment failed!"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=106108784" \
            -d "text=$MSG"
